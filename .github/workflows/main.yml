          UI_PASSED=${{ needs.ui-tests.outputs.passed }}
          UI_FAILED=${{ needs.ui-tests.outputs.failed }}
          API_PASSED=${{ needs.api-tests.outputs.passed }}
          API_FAILED=${{ needs.api-tests.outputs.failed }}
          PERF_PASSED=${{ needs.performance-tests.outputs.passed }}
          PERF_FAILED=${{ needs.performance-tests.outputs.failed }}
          STRESS_PASSED=${{ needs.stress-tests.outputs.passed }}
          STRESS_FAILED=${{ needs.stress-tests.outputs.failed }}
          
