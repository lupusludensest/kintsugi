name: Kintsugi Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *" # Runs at 7:00 AM UTC (2:00 AM EST)
  workflow_dispatch: # Allows manual triggering

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.test.outcome }}
      passed: ${{ steps.parse-results.outputs.passed }}
      failed: ${{ steps.parse-results.outputs.failed }}
      
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run UI tests
        id: test
        run: npx playwright test ui_tests/ 2>&1 | tee ui_test_output.log
        continue-on-error: true
        env:
          CI: true
      - name: Parse test results
        id: parse-results
        run: |
          if [ -f ui_test_output.log ]; then
            # Extract passed and failed counts from Playwright output
            PASSED=$(grep -o '[0-9]\+ passed' ui_test_output.log | grep -o '[0-9]\+' || echo "0")
            FAILED=$(grep -o '[0-9]\+ failed' ui_test_output.log | grep -o '[0-9]\+' || echo "0")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "UI Tests - Passed: $PASSED, Failed: $FAILED"
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui
          path: |
            playwright-report/
            test-results/
            ui_test_output.log
          retention-days: 30
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.test.outcome }}
      passed: ${{ steps.parse-results.outputs.passed }}
      failed: ${{ steps.parse-results.outputs.failed }}
      
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run API tests
        id: test
        run: npx playwright test api_tests/ 2>&1 | tee api_test_output.log
        continue-on-error: true
        env:
          CI: true
      - name: Parse test results
        id: parse-results
        run: |
          if [ -f api_test_output.log ]; then
            PASSED=$(grep -o '[0-9]\+ passed' api_test_output.log | grep -o '[0-9]\+' || echo "0")
            FAILED=$(grep -o '[0-9]\+ failed' api_test_output.log | grep -o '[0-9]\+' || echo "0")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "API Tests - Passed: $PASSED, Failed: $FAILED"
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: |
            playwright-report/
            test-results/
            api_test_output.log
          retention-days: 30
  performance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.test.outcome }}
      passed: ${{ steps.parse-results.outputs.passed }}
      failed: ${{ steps.parse-results.outputs.failed }}
      
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Performance tests
        id: test
        run: npx playwright test performance_tests/ 2>&1 | tee performance_test_output.log
        continue-on-error: true
        env:
          CI: true
      - name: Parse test results
        id: parse-results
        run: |
          if [ -f performance_test_output.log ]; then
            PASSED=$(grep -o '[0-9]\+ passed' performance_test_output.log | grep -o '[0-9]\+' || echo "0")
            FAILED=$(grep -o '[0-9]\+ failed' performance_test_output.log | grep -o '[0-9]\+' || echo "0")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "Performance Tests - Passed: $PASSED, Failed: $FAILED"
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-performance
          path: |
            playwright-report/
            test-results/
            performance_test_output.log
          retention-days: 30
  stress-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.test.outcome }}
      passed: ${{ steps.parse-results.outputs.passed }}
      failed: ${{ steps.parse-results.outputs.failed }}
      
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Stress tests
        id: test
        run: npx playwright test stress_tests/ 2>&1 | tee stress_test_output.log
        continue-on-error: true
        env:
          CI: true
      - name: Parse test results
        id: parse-results
        run: |
          if [ -f stress_test_output.log ]; then
            PASSED=$(grep -o '[0-9]\+ passed' stress_test_output.log | grep -o '[0-9]\+' || echo "0")
            FAILED=$(grep -o '[0-9]\+ failed' stress_test_output.log | grep -o '[0-9]\+' || echo "0")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "Stress Tests - Passed: $PASSED, Failed: $FAILED"
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stress
          path: |
            playwright-report/
            test-results/
            stress_test_output.log
          retention-days: 30

  notify:
    needs: [ui-tests, api-tests, performance-tests, stress-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Kintsugi Test Results - ${{ needs.ui-tests.result == 'success' && needs.api-tests.result == 'success' && needs.performance-tests.result == 'success' && needs.stress-tests.result == 'success' && 'SUCCESS' || 'FAILURE' }}
          to: gurovvic@gmail.com,rodionigor@gmail.com, svetlanalegkaya15@gmail.com, petushin@kpd-cargo.com
          from: GitHub Actions
          html_body: |
            <h2>Kintsugi Test Suite Results</h2>
            <p>Overall Status: <strong>${{ needs.ui-tests.result == 'success' && needs.api-tests.result == 'success' && needs.performance-tests.result == 'success' && needs.stress-tests.result == 'success' && 'SUCCESS' || 'FAILURE' }}</strong></p>
            <p>Workflow: <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.workflow }}</a></p>              <h3>Test Groups Results:</h3>
            <ul>
              <li>UI Tests: ${{ needs.ui-tests.outputs.passed }}✅ and ${{ needs.ui-tests.outputs.failed }}❌</li>
              <li>API Tests: ${{ needs.api-tests.outputs.passed }}✅ and ${{ needs.api-tests.outputs.failed }}❌</li>
              <li>Performance Tests: ${{ needs.performance-tests.outputs.passed }}✅ and ${{ needs.performance-tests.outputs.failed }}❌</li>
              <li>Stress Tests: ${{ needs.stress-tests.outputs.passed }}✅ and ${{ needs.stress-tests.outputs.failed }}❌</li>            </ul>
              <h3>Test Summary:</h3>
            <p>
              UI Tests: ${{ needs.ui-tests.outputs.passed }}✅ and ${{ needs.ui-tests.outputs.failed }}❌<br>
              API Tests: ${{ needs.api-tests.outputs.passed }}✅ and ${{ needs.api-tests.outputs.failed }}❌<br>
              Performance Tests: ${{ needs.performance-tests.outputs.passed }}✅ and ${{ needs.performance-tests.outputs.failed }}❌<br>
              Stress Tests: ${{ needs.stress-tests.outputs.passed }}✅ and ${{ needs.stress-tests.outputs.failed }}❌
            </p>
            
            <p>For detailed results, please check the workflow artifacts in GitHub Actions.</p>
            
            <hr>
            <p><small>This is an automated message from GitHub Actions</small></p>
