name: Kintsugi Test Suite

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *" # Runs at 7:00 AM UTC (2:00 AM EST)

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.test.outcome }}
      passed: ${{ steps.parse-results.outputs.passed }}
      failed: ${{ steps.parse-results.outputs.failed }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Create .env file from secrets
        run: |
          echo "KINTSUGI_LOGIN=${KINTSUGI_LOGIN}" >> .env
          echo "KINTSUGI_PASSWORD=${KINTSUGI_PASSWORD}" >> .env
          echo "KINTSUGI_WRONG_LOGIN=${KINTSUGI_WRONG_LOGIN}" >> .env
          echo "KINTSUGI_WRONG_PASSWORD=${KINTSUGI_WRONG_PASSWORD}" >> .env
          echo "KINTSUGI_BASE_URL=${KINTSUGI_BASE_URL}" >> .env
          echo "KINTSUGI_LOGIN_URL=${KINTSUGI_LOGIN_URL}" >> .env
          echo "KINTSUGI_AUTH_TOKEN=${KINTSUGI_AUTH_TOKEN}" >> .env
          echo "TIMEOUT=${TIMEOUT}" >> .env
        env:
          KINTSUGI_LOGIN: ${{ secrets.KINTSUGI_LOGIN }}
          KINTSUGI_PASSWORD: ${{ secrets.KINTSUGI_PASSWORD }}
          KINTSUGI_WRONG_LOGIN: ${{ secrets.KINTSUGI_WRONG_LOGIN }}
          KINTSUGI_WRONG_PASSWORD: ${{ secrets.KINTSUGI_WRONG_PASSWORD }}
          KINTSUGI_BASE_URL: ${{ secrets.KINTSUGI_BASE_URL }}
          KINTSUGI_LOGIN_URL: ${{ secrets.KINTSUGI_LOGIN_URL }}
          KINTSUGI_AUTH_TOKEN: ${{ secrets.KINTSUGI_AUTH_TOKEN }}
          TIMEOUT: ${{ secrets.TIMEOUT }}

      - name: Check site availability from CI
        run: curl -Iv --max-time 15 ${{ secrets.KINTSUGI_BASE_URL }} || true

      - name: Run UI tests (headed mode with xvfb)
        id: test
        run: |
          echo "Running UI tests with debug logging and xvfb-run..."
          export DEBUG=pw:api,pw:browser*
          export PWDEBUG=console
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npx playwright test ui_tests/ --reporter=list,html --trace on --update-snapshots 2>&1 | tee ui_test_output.log || true
        continue-on-error: true
        env:
          CI: true
          DEBUG: pw:api,pw:browser*
          NODE_ENV: ci
          PWDEBUG: console

      - name: Parse test results
        id: parse-results
        run: |
          if [ -f ui_test_output.log ]; then
            PASSED=$(grep -o '[0-9]\+ passed' ui_test_output.log | grep -o '[0-9]\+' | tail -1 || echo "0")
            FAILED=$(grep -o '[0-9]\+ failed' ui_test_output.log | grep -o '[0-9]\+' | tail -1 || echo "0")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "UI Tests - Passed: $PASSED, Failed: $FAILED"
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui
          path: |
            playwright-report/
            test-results/
            ui_test_output.log
          retention-days: 30

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.test.outcome }}
      passed: ${{ steps.parse-results.outputs.passed }}
      failed: ${{ steps.parse-results.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Create .env file from secrets
        run: |
          echo "KINTSUGI_LOGIN=${KINTSUGI_LOGIN}" >> .env
          echo "KINTSUGI_PASSWORD=${KINTSUGI_PASSWORD}" >> .env
          echo "KINTSUGI_WRONG_LOGIN=${KINTSUGI_WRONG_LOGIN}" >> .env
          echo "KINTSUGI_WRONG_PASSWORD=${KINTSUGI_WRONG_PASSWORD}" >> .env
          echo "KINTSUGI_BASE_URL=${KINTSUGI_BASE_URL}" >> .env
          echo "KINTSUGI_LOGIN_URL=${KINTSUGI_LOGIN_URL}" >> .env
          echo "KINTSUGI_AUTH_TOKEN=${KINTSUGI_AUTH_TOKEN}" >> .env
          echo "TIMEOUT=${TIMEOUT}" >> .env
        env:
          KINTSUGI_LOGIN: ${{ secrets.KINTSUGI_LOGIN }}
          KINTSUGI_PASSWORD: ${{ secrets.KINTSUGI_PASSWORD }}
          KINTSUGI_WRONG_LOGIN: ${{ secrets.KINTSUGI_WRONG_LOGIN }}
          KINTSUGI_WRONG_PASSWORD: ${{ secrets.KINTSUGI_WRONG_PASSWORD }}
          KINTSUGI_BASE_URL: ${{ secrets.KINTSUGI_BASE_URL }}
          KINTSUGI_LOGIN_URL: ${{ secrets.KINTSUGI_LOGIN_URL }}
          KINTSUGI_AUTH_TOKEN: ${{ secrets.KINTSUGI_AUTH_TOKEN }}
          TIMEOUT: ${{ secrets.TIMEOUT }}

      - name: Print env vars for debug
        run: cat .env

      - name: Run API tests
        id: test
        run: npx playwright test api_tests/ 2>&1 | tee api_test_output.log || true
        continue-on-error: true
        env:
          CI: true
      - name: Parse test results
        id: parse-results
        run: |
          if [ -f api_test_output.log ]; then
            PASSED=$(grep -o '[0-9]\+ passed' api_test_output.log | grep -o '[0-9]\+' | tail -1 || echo "0")
            FAILED=$(grep -o '[0-9]\+ failed' api_test_output.log | grep -o '[0-9]\+' | tail -1 || echo "0")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "API Tests - Passed: $PASSED, Failed: $FAILED"
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: |
            playwright-report/
            test-results/
            api_test_output.log
          retention-days: 30

  performance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.test.outcome }}
      passed: ${{ steps.parse-results.outputs.passed }}
      failed: ${{ steps.parse-results.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Create .env file from secrets
        run: |
          echo "KINTSUGI_LOGIN=${KINTSUGI_LOGIN}" >> .env
          echo "KINTSUGI_PASSWORD=${KINTSUGI_PASSWORD}" >> .env
          echo "KINTSUGI_WRONG_LOGIN=${KINTSUGI_WRONG_LOGIN}" >> .env
          echo "KINTSUGI_WRONG_PASSWORD=${KINTSUGI_WRONG_PASSWORD}" >> .env
          echo "KINTSUGI_BASE_URL=${KINTSUGI_BASE_URL}" >> .env
          echo "KINTSUGI_LOGIN_URL=${KINTSUGI_LOGIN_URL}" >> .env
          echo "KINTSUGI_AUTH_TOKEN=${KINTSUGI_AUTH_TOKEN}" >> .env
          echo "TIMEOUT=${TIMEOUT}" >> .env
        env:
          KINTSUGI_LOGIN: ${{ secrets.KINTSUGI_LOGIN }}
          KINTSUGI_PASSWORD: ${{ secrets.KINTSUGI_PASSWORD }}
          KINTSUGI_WRONG_LOGIN: ${{ secrets.KINTSUGI_WRONG_LOGIN }}
          KINTSUGI_WRONG_PASSWORD: ${{ secrets.KINTSUGI_WRONG_PASSWORD }}
          KINTSUGI_BASE_URL: ${{ secrets.KINTSUGI_BASE_URL }}
          KINTSUGI_LOGIN_URL: ${{ secrets.KINTSUGI_LOGIN_URL }}
          KINTSUGI_AUTH_TOKEN: ${{ secrets.KINTSUGI_AUTH_TOKEN }}
          TIMEOUT: ${{ secrets.TIMEOUT }}

      - name: Print env vars for debug
        run: cat .env

      - name: Run Performance tests
        id: test
        run: npx playwright test performance_tests/ 2>&1 | tee performance_test_output.log || true
        continue-on-error: true
        env:
          CI: true
      - name: Parse test results
        id: parse-results
        run: |
          if [ -f performance_test_output.log ]; then
            PASSED=$(grep -o '[0-9]\+ passed' performance_test_output.log | grep -o '[0-9]\+' | tail -1 || echo "0")
            FAILED=$(grep -o '[0-9]\+ failed' performance_test_output.log | grep -o '[0-9]\+' | tail -1 || echo "0")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "Performance Tests - Passed: $PASSED, Failed: $FAILED"
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-performance
          path: |
            playwright-report/
            test-results/
            performance_test_output.log
          retention-days: 30

  stress-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.test.outcome }}
      passed: ${{ steps.parse-results.outputs.passed }}
      failed: ${{ steps.parse-results.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Create .env file from secrets
        run: |
          echo "KINTSUGI_LOGIN=${KINTSUGI_LOGIN}" >> .env
          echo "KINTSUGI_PASSWORD=${KINTSUGI_PASSWORD}" >> .env
          echo "KINTSUGI_WRONG_LOGIN=${KINTSUGI_WRONG_LOGIN}" >> .env
          echo "KINTSUGI_WRONG_PASSWORD=${KINTSUGI_WRONG_PASSWORD}" >> .env
          echo "KINTSUGI_BASE_URL=${KINTSUGI_BASE_URL}" >> .env
          echo "KINTSUGI_LOGIN_URL=${KINTSUGI_LOGIN_URL}" >> .env
          echo "KINTSUGI_AUTH_TOKEN=${KINTSUGI_AUTH_TOKEN}" >> .env
          echo "TIMEOUT=${TIMEOUT}" >> .env
        env:
          KINTSUGI_LOGIN: ${{ secrets.KINTSUGI_LOGIN }}
          KINTSUGI_PASSWORD: ${{ secrets.KINTSUGI_PASSWORD }}
          KINTSUGI_WRONG_LOGIN: ${{ secrets.KINTSUGI_WRONG_LOGIN }}
          KINTSUGI_WRONG_PASSWORD: ${{ secrets.KINTSUGI_WRONG_PASSWORD }}
          KINTSUGI_BASE_URL: ${{ secrets.KINTSUGI_BASE_URL }}
          KINTSUGI_LOGIN_URL: ${{ secrets.KINTSUGI_LOGIN_URL }}
          KINTSUGI_AUTH_TOKEN: ${{ secrets.KINTSUGI_AUTH_TOKEN }}
          TIMEOUT: ${{ secrets.TIMEOUT }}

      - name: Print env vars for debug
        run: cat .env

      - name: Run Stress tests
        id: test
        run: npx playwright test stress_tests/ 2>&1 | tee stress_test_output.log || true
        continue-on-error: true
        env:
          CI: true
      - name: Parse test results
        id: parse-results
        run: |
          if [ -f stress_test_output.log ]; then
            PASSED=$(grep -o '[0-9]\+ passed' stress_test_output.log | grep -o '[0-9]\+' | tail -1 || echo "0")
            FAILED=$(grep -o '[0-9]\+ failed' stress_test_output.log | grep -o '[0-9]\+' | tail -1 || echo "0")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "Stress Tests - Passed: $PASSED, Failed: $FAILED"
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stress
          path: |
            playwright-report/
            test-results/
            stress_test_output.log
          retention-days: 30

  notify:
    needs: [ui-tests, api-tests, performance-tests, stress-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      
