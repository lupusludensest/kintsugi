name: Kintsugi Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *" # Runs at 7:00 AM UTC (2:00 AM EST)
  workflow_dispatch: # Allows manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      matrix:
        test-group: [ui, api, performance, stress]
      fail-fast: false # Continue with other tests even if one group fails

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run API tests
        if: matrix.test-group == 'api'
        run: npx playwright test api_tests/
        env:
          CI: true

      - name: Run UI tests
        if: matrix.test-group == 'ui'
        run: npx playwright test ui_tests/
        env:
          CI: true

      - name: Run Performance tests
        if: matrix.test-group == 'performance'
        run: npx playwright test performance_tests/
        env:
          CI: true

      - name: Run Stress tests
        if: matrix.test-group == 'stress'
        run: npx playwright test stress_tests/
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.test-group }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  notify:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Kintsugi Test Results - ${{ needs.test.result }}
          to: gurovvic@gmail.com,rodionigor@gmail.com, svetlanalegkaya15@gmail.com
          from: GitHub Actions
          html_body: |
            <h2>Kintsugi Test Suite Results</h2>
            <p>Status: <strong>${{ needs.test.result }}</strong></p>
            <p>Workflow: <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.workflow }}</a></p>
            
            <h3>Test Groups Results:</h3>
            <ul>
              <li>UI Tests</li>
              <li>API Tests</li>
              <li>Performance Tests</li>
              <li>Stress Tests</li>
            </ul>
            
            <p>For detailed results, please check the workflow artifacts in GitHub Actions.</p>
            
            <hr>
            <p><small>This is an automated message from GitHub Actions</small></p>
          attachments: |
            artifacts/**/*.html
