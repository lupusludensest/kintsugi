name: Kintsugi Test Suite

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *" # Runs at 7:00 AM UTC (2:00 AM EST)

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.test.outcome }}
      passed: ${{ steps.parse-results.outputs.passed }}
      failed: ${{ steps.parse-results.outputs.failed }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Create .env file from secrets
        run: |
          echo "KINTSUGI_LOGIN=${KINTSUGI_LOGIN}" >> .env
          echo "KINTSUGI_PASSWORD=${KINTSUGI_PASSWORD}" >> .env
          echo "KINTSUGI_WRONG_LOGIN=${KINTSUGI_WRONG_LOGIN}" >> .env
          echo "KINTSUGI_WRONG_PASSWORD=${KINTSUGI_WRONG_PASSWORD}" >> .env
          echo "KINTSUGI_BASE_URL=${KINTSUGI_BASE_URL}" >> .env
          echo "KINTSUGI_LOGIN_URL=${KINTSUGI_LOGIN_URL}" >> .env
          echo "KINTSUGI_AUTH_TOKEN=${KINTSUGI_AUTH_TOKEN}" >> .env
          echo "TIMEOUT=${TIMEOUT}" >> .env
        env:
          KINTSUGI_LOGIN: ${{ secrets.KINTSUGI_LOGIN }}
          KINTSUGI_PASSWORD: ${{ secrets.KINTSUGI_PASSWORD }}
          KINTSUGI_WRONG_LOGIN: ${{ secrets.KINTSUGI_WRONG_LOGIN }}
          KINTSUGI_WRONG_PASSWORD: ${{ secrets.KINTSUGI_WRONG_PASSWORD }}
          KINTSUGI_BASE_URL: ${{ secrets.KINTSUGI_BASE_URL }}
          KINTSUGI_LOGIN_URL: ${{ secrets.KINTSUGI_LOGIN_URL }}
          KINTSUGI_AUTH_TOKEN: ${{ secrets.KINTSUGI_AUTH_TOKEN }}
          TIMEOUT: ${{ secrets.TIMEOUT }}

      - name: Check site availability from CI
        run: curl -Iv --max-time 15 ${{ secrets.KINTSUGI_BASE_URL }} || true

      - name: Run UI tests
        id: test
        run: |
          echo "Running UI tests with debug logging..."
          export DEBUG=pw:api,pw:browser*
          export PWDEBUG=console
          npx playwright test ui_tests/ --reporter=list,html --trace on --update-snapshots 2>&1 | tee ui_test_output.log || true
        continue-on-error: true
        env:
          CI: true
          DEBUG: pw:api,pw:browser*
          NODE_ENV: ci
          PWDEBUG: console

      - name: Parse test results
        id: parse-results
        run: |
          if [ -f ui_test_output.log ]; then
            PASSED=$(grep -o '[0-9]\+ passed' ui_test_output.log | grep -o '[0-9]\+' | tail -1 || echo "0")
            FAILED=$(grep -o '[0-9]\+ failed' ui_test_output.log | grep -o '[0-9]\+' | tail -1 || echo "0")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "UI Tests - Passed: $PASSED, Failed: $FAILED"
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui
          path: |
            playwright-report/
            test-results/
            ui_test_output.log
          retention-days: 30

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.test.outcome }}
      passed: ${{ steps.parse-results.outputs.passed }}
      failed: ${{ steps.parse-results.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Create .env file from secrets
        run: |
          echo "KINTSUGI_LOGIN=${KINTSUGI_LOGIN}" >> .env
          echo "KINTSUGI_PASSWORD=${KINTSUGI_PASSWORD}" >> .env
          echo "KINTSUGI_WRONG_LOGIN=${KINTSUGI_WRONG_LOGIN}" >> .env
          echo "KINTSUGI_WRONG_PASSWORD=${KINTSUGI_WRONG_PASSWORD}" >> .env
          echo "KINTSUGI_BASE_URL=${KINTSUGI_BASE_URL}" >> .env
          echo "KINTSUGI_LOGIN_URL=${KINTSUGI_LOGIN_URL}" >> .env
          echo "KINTSUGI_AUTH_TOKEN=${KINTSUGI_AUTH_TOKEN}" >> .env
          echo "TIMEOUT=${TIMEOUT}" >> .env
        env:
          KINTSUGI_LOGIN: ${{ secrets.KINTSUGI_LOGIN }}
          KINTSUGI_PASSWORD: ${{ secrets.KINTSUGI_PASSWORD }}
          KINTSUGI_WRONG_LOGIN: ${{ secrets.KINTSUGI_WRONG_LOGIN }}
          KINTSUGI_WRONG_PASSWORD: ${{ secrets.KINTSUGI_WRONG_PASSWORD }}
          KINTSUGI_BASE_URL: ${{ secrets.KINTSUGI_BASE_URL }}
          KINTSUGI_LOGIN_URL: ${{ secrets.KINTSUGI_LOGIN_URL }}
          KINTSUGI_AUTH_TOKEN: ${{ secrets.KINTSUGI_AUTH_TOKEN }}
          TIMEOUT: ${{ secrets.TIMEOUT }}

      - name: Print env vars for debug
        run: cat .env

      - name: Run API tests
        id: test
        run: npx playwright test api_tests/ 2>&1 | tee api_test_output.log || true
        continue-on-error: true
        env:
          CI: true
      - name: Parse test results
        id: parse-results
        run: |
          if [ -f api_test_output.log ]; then
            PASSED=$(grep -o '[0-9]\+ passed' api_test_output.log | grep -o '[0-9]\+' | tail -1 || echo "0")
            FAILED=$(grep -o '[0-9]\+ failed' api_test_output.log | grep -o '[0-9]\+' | tail -1 || echo "0")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "API Tests - Passed: $PASSED, Failed: $FAILED"
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: |
            playwright-report/
            test-results/
            api_test_output.log
          retention-days: 30

  performance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.test.outcome }}
      passed: ${{ steps.parse-results.outputs.passed }}
      failed: ${{ steps.parse-results.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Create .env file from secrets
        run: |
          echo "KINTSUGI_LOGIN=${KINTSUGI_LOGIN}" >> .env
          echo "KINTSUGI_PASSWORD=${KINTSUGI_PASSWORD}" >> .env
          echo "KINTSUGI_WRONG_LOGIN=${KINTSUGI_WRONG_LOGIN}" >> .env
          echo "KINTSUGI_WRONG_PASSWORD=${KINTSUGI_WRONG_PASSWORD}" >> .env
          echo "KINTSUGI_BASE_URL=${KINTSUGI_BASE_URL}" >> .env
          echo "KINTSUGI_LOGIN_URL=${KINTSUGI_LOGIN_URL}" >> .env
          echo "KINTSUGI_AUTH_TOKEN=${KINTSUGI_AUTH_TOKEN}" >> .env
          echo "TIMEOUT=${TIMEOUT}" >> .env
        env:
          KINTSUGI_LOGIN: ${{ secrets.KINTSUGI_LOGIN }}
          KINTSUGI_PASSWORD: ${{ secrets.KINTSUGI_PASSWORD }}
          KINTSUGI_WRONG_LOGIN: ${{ secrets.KINTSUGI_WRONG_LOGIN }}
          KINTSUGI_WRONG_PASSWORD: ${{ secrets.KINTSUGI_WRONG_PASSWORD }}
          KINTSUGI_BASE_URL: ${{ secrets.KINTSUGI_BASE_URL }}
          KINTSUGI_LOGIN_URL: ${{ secrets.KINTSUGI_LOGIN_URL }}
          KINTSUGI_AUTH_TOKEN: ${{ secrets.KINTSUGI_AUTH_TOKEN }}
          TIMEOUT: ${{ secrets.TIMEOUT }}

      - name: Print env vars for debug
        run: cat .env

      - name: Run Performance tests
        id: test
        run: npx playwright test performance_tests/ 2>&1 | tee performance_test_output.log || true
        continue-on-error: true
        env:
          CI: true
      - name: Parse test results
        id: parse-results
        run: |
          if [ -f performance_test_output.log ]; then
            PASSED=$(grep -o '[0-9]\+ passed' performance_test_output.log | grep -o '[0-9]\+' | tail -1 || echo "0")
            FAILED=$(grep -o '[0-9]\+ failed' performance_test_output.log | grep -o '[0-9]\+' | tail -1 || echo "0")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "Performance Tests - Passed: $PASSED, Failed: $FAILED"
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-performance
          path: |
            playwright-report/
            test-results/
            performance_test_output.log
          retention-days: 30

  stress-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.test.outcome }}
      passed: ${{ steps.parse-results.outputs.passed }}
      failed: ${{ steps.parse-results.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Create .env file from secrets
        run: |
          echo "KINTSUGI_LOGIN=${KINTSUGI_LOGIN}" >> .env
          echo "KINTSUGI_PASSWORD=${KINTSUGI_PASSWORD}" >> .env
          echo "KINTSUGI_WRONG_LOGIN=${KINTSUGI_WRONG_LOGIN}" >> .env
          echo "KINTSUGI_WRONG_PASSWORD=${KINTSUGI_WRONG_PASSWORD}" >> .env
          echo "KINTSUGI_BASE_URL=${KINTSUGI_BASE_URL}" >> .env
          echo "KINTSUGI_LOGIN_URL=${KINTSUGI_LOGIN_URL}" >> .env
          echo "KINTSUGI_AUTH_TOKEN=${KINTSUGI_AUTH_TOKEN}" >> .env
          echo "TIMEOUT=${TIMEOUT}" >> .env
        env:
          KINTSUGI_LOGIN: ${{ secrets.KINTSUGI_LOGIN }}
          KINTSUGI_PASSWORD: ${{ secrets.KINTSUGI_PASSWORD }}
          KINTSUGI_WRONG_LOGIN: ${{ secrets.KINTSUGI_WRONG_LOGIN }}
          KINTSUGI_WRONG_PASSWORD: ${{ secrets.KINTSUGI_WRONG_PASSWORD }}
          KINTSUGI_BASE_URL: ${{ secrets.KINTSUGI_BASE_URL }}
          KINTSUGI_LOGIN_URL: ${{ secrets.KINTSUGI_LOGIN_URL }}
          KINTSUGI_AUTH_TOKEN: ${{ secrets.KINTSUGI_AUTH_TOKEN }}
          TIMEOUT: ${{ secrets.TIMEOUT }}

      - name: Print env vars for debug
        run: cat .env

      - name: Run Stress tests
        id: test
        run: npx playwright test stress_tests/ 2>&1 | tee stress_test_output.log || true
        continue-on-error: true
        env:
          CI: true
      - name: Parse test results
        id: parse-results
        run: |
          if [ -f stress_test_output.log ]; then
            PASSED=$(grep -o '[0-9]\+ passed' stress_test_output.log | grep -o '[0-9]\+' | tail -1 || echo "0")
            FAILED=$(grep -o '[0-9]\+ failed' stress_test_output.log | grep -o '[0-9]\+' | tail -1 || echo "0")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "Stress Tests - Passed: $PASSED, Failed: $FAILED"
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stress
          path: |
            playwright-report/
            test-results/
            stress_test_output.log
          retention-days: 30

  notify:
    needs: [ui-tests, api-tests, performance-tests, stress-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Install bc for calculations
        run: sudo apt-get update && sudo apt-get install -y bc
      
      - name: Calculate totals and pass rate
        id: calculate
        run: |
          # Get passed and failed counts
          UI_PASSED=${{ needs.ui-tests.outputs.passed }}
          UI_FAILED=${{ needs.ui-tests.outputs.failed }}
          API_PASSED=${{ needs.api-tests.outputs.passed }}
          API_FAILED=${{ needs.api-tests.outputs.failed }}
          PERF_PASSED=${{ needs.performance-tests.outputs.passed }}
          PERF_FAILED=${{ needs.performance-tests.outputs.failed }}
          STRESS_PASSED=${{ needs.stress-tests.outputs.passed }}
          STRESS_FAILED=${{ needs.stress-tests.outputs.failed }}
          
          # Calculate totals
          TOTAL_PASSED=$((UI_PASSED + API_PASSED + PERF_PASSED + STRESS_PASSED))
          TOTAL_FAILED=$((UI_FAILED + API_FAILED + PERF_FAILED + STRESS_FAILED))
          TOTAL_TESTS=$((TOTAL_PASSED + TOTAL_FAILED))
          
          # Calculate pass rate (using bc for floating point)
          if [ $TOTAL_TESTS -gt 0 ]; then
            PASS_RATE=$(echo "scale=2; $TOTAL_PASSED * 100 / $TOTAL_TESTS" | bc)
          else
            PASS_RATE="0.00"
          fi
          
          # Calculate individual totals
          UI_TOTAL=$((UI_PASSED + UI_FAILED))
          API_TOTAL=$((API_PASSED + API_FAILED))
          PERF_TOTAL=$((PERF_PASSED + PERF_FAILED))
          STRESS_TOTAL=$((STRESS_PASSED + STRESS_FAILED))
          
          echo "total_passed=$TOTAL_PASSED" >> $GITHUB_OUTPUT
          echo "total_failed=$TOTAL_FAILED" >> $GITHUB_OUTPUT
          echo "total_tests=$TOTAL_TESTS" >> $GITHUB_OUTPUT
          echo "pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT
          echo "ui_total=$UI_TOTAL" >> $GITHUB_OUTPUT
          echo "api_total=$API_TOTAL" >> $GITHUB_OUTPUT
          echo "perf_total=$PERF_TOTAL" >> $GITHUB_OUTPUT
          echo "stress_total=$STRESS_TOTAL" >> $GITHUB_OUTPUT
          
          echo "Calculated totals: Passed=$TOTAL_PASSED, Failed=$TOTAL_FAILED, Total=$TOTAL_TESTS, Pass Rate=$PASS_RATE%"
        shell: bash
      
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Kintsugi Test Results - ${{ needs.ui-tests.result == 'success' && needs.api-tests.result == 'success' && needs.performance-tests.result == 'success' && needs.stress-tests.result == 'success' && 'SUCCESS' || 'FAILURE' }}
          to: gurovvic@gmail.com,rodionigor@gmail.com, svetlanalegkaya15@gmail.com, petushin@kpd-cargo.com, atevs2789@gmail.com
          from: GitHub Actions
          html_body: |
            <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
              <h2 style="color: #2563eb; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px;">🔍 Kintsugi Test Suite Results</h2>
              
              <div style="background-color: #f9fafb; border-left: 4px solid ${{ needs.ui-tests.result == 'success' && needs.api-tests.result == 'success' && needs.performance-tests.result == 'success' && needs.stress-tests.result == 'success' && '#10b981' || '#ef4444' }}; padding: 15px; margin: 20px 0;">
                <p style="margin: 0; font-size: 18px; font-weight: bold;">
                  Overall Status: ${{ needs.ui-tests.result == 'success' && needs.api-tests.result == 'success' && needs.performance-tests.result == 'success' && needs.stress-tests.result == 'success' && '✅ SUCCESS' || '❌ FAILURE' }}
                </p>
              </div>
              
              <h3 style="color: #374151; margin-top: 30px;">📊 Test Results Breakdown:</h3>
              <ul style="list-style: none; padding: 0;">
                <li style="background-color: #f3f4f6; margin: 8px 0; padding: 12px; border-radius: 6px;">
                  <strong>UI Tests:</strong> ${{ needs.ui-tests.outputs.passed }}✅ and ${{ needs.ui-tests.outputs.failed }}❌ (Total: ${{ steps.calculate.outputs.ui_total }})
                </li>
                <li style="background-color: #f3f4f6; margin: 8px 0; padding: 12px; border-radius: 6px;">
                  <strong>API Tests:</strong> ${{ needs.api-tests.outputs.passed }}✅ and ${{ needs.api-tests.outputs.failed }}❌ (Total: ${{ steps.calculate.outputs.api_total }})
                </li>
                <li style="background-color: #f3f4f6; margin: 8px 0; padding: 12px; border-radius: 6px;">
                  <strong>Performance Tests:</strong> ${{ needs.performance-tests.outputs.passed }}✅ and ${{ needs.performance-tests.outputs.failed }}❌ (Total: ${{ steps.calculate.outputs.perf_total }})
                </li>
                <li style="background-color: #f3f4f6; margin: 8px 0; padding: 12px; border-radius: 6px;">
                  <strong>Stress Tests:</strong> ${{ needs.stress-tests.outputs.passed }}✅ and ${{ needs.stress-tests.outputs.failed }}❌ (Total: ${{ steps.calculate.outputs.stress_total }})
                </li>
              </ul>
              
              <h3 style="color: #374151; margin-top: 30px;">📈 Summary:</h3>
              <div style="background-color: #ecfdf5; border: 1px solid #d1fae5; border-radius: 8px; padding: 20px; margin: 15px 0;">
                <p style="margin: 5px 0; font-size: 16px;"><strong>Total Passed:</strong> ${{ steps.calculate.outputs.total_passed }}</p>
                <p style="margin: 5px 0; font-size: 16px;"><strong>Total Tests:</strong> ${{ steps.calculate.outputs.total_tests }}</p>
                <p style="margin: 5px 0; font-size: 18px; color: #059669;"><strong>Pass Rate: ${{ steps.calculate.outputs.pass_rate }}%</strong></p>
              </div>
              
              <div style="margin-top: 30px; padding: 15px; background-color: #f8fafc; border-radius: 6px;">
                <p style="margin: 0;">
                  🔗 <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" style="color: #2563eb; text-decoration: none;">View Workflow Run</a>
                </p>
              </div>
              
              <hr style="margin-top: 30px; border: none; border-top: 1px solid #e5e7eb;">
              <p style="text-align: center; color: #6b7280; font-size: 12px; margin: 10px 0;">
                <small>This is an automated message from GitHub Actions</small>
              </p>
            </div>

      - name: Send Slack notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: |
            🔍 Kintsugi Test Suite Results
            
            Overall Status: ${{ needs.ui-tests.result == 'success' && needs.api-tests.result == 'success' && needs.performance-tests.result == 'success' && needs.stress-tests.result == 'success' && 'SUCCESS' || 'FAILURE' }}
            
            Test Results:
            • UI Tests: ${{ needs.ui-tests.outputs.passed }} passed, ${{ needs.ui-tests.outputs.failed }} failed
            • API Tests: ${{ needs.api-tests.outputs.passed }} passed, ${{ needs.api-tests.outputs.failed }} failed
            • Performance Tests: ${{ needs.performance-tests.outputs.passed }} passed, ${{ needs.performance-tests.outputs.failed }} failed
            • Stress Tests: ${{ needs.stress-tests.outputs.passed }} passed, ${{ needs.stress-tests.outputs.failed }} failed
            
            Total: ${{ steps.calculate.outputs.total_passed }}/${{ steps.calculate.outputs.total_tests }} passed (${{ steps.calculate.outputs.pass_rate }}%)
            
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}