name: Kintsugi Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *" # Runs at 7:00 AM UTC (2:00 AM EST)
  workflow_dispatch: # Allows manual triggering

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.test.outcome }}
      
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run UI tests
        id: test
        run: npx playwright test ui_tests/
        continue-on-error: true
        env:
          CI: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.test.outcome }}
      
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run API tests
        id: test
        run: npx playwright test api_tests/
        continue-on-error: true
        env:
          CI: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  performance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.test.outcome }}
      
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Performance tests
        id: test
        run: npx playwright test performance_tests/
        continue-on-error: true
        env:
          CI: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-performance
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  stress-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.test.outcome }}
      
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Stress tests
        id: test
        run: npx playwright test stress_tests/
        continue-on-error: true
        env:
          CI: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stress
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  notify:
    needs: [ui-tests, api-tests, performance-tests, stress-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Kintsugi Test Results - ${{ needs.ui-tests.result == 'success' && needs.api-tests.result == 'success' && needs.performance-tests.result == 'success' && needs.stress-tests.result == 'success' && 'SUCCESS' || 'FAILURE' }}
          to: gurovvic@gmail.com,rodionigor@gmail.com, svetlanalegkaya15@gmail.com, petushin@kpd-cargo.com
          from: GitHub Actions
          html_body: |
            <h2>Kintsugi Test Suite Results</h2>
            <p>Overall Status: <strong>${{ needs.ui-tests.result == 'success' && needs.api-tests.result == 'success' && needs.performance-tests.result == 'success' && needs.stress-tests.result == 'success' && 'SUCCESS' || 'FAILURE' }}</strong></p>
            <p>Workflow: <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.workflow }}</a></p>
              <h3>Test Groups Results:</h3>
            <ul>
              <li>UI Tests: <strong>${{ needs.ui-tests.outputs.status == 'success' && '✅ PASSED' || '❌ FAILED' }}</strong></li>
              <li>API Tests: <strong>${{ needs.api-tests.outputs.status == 'success' && '✅ PASSED' || '❌ FAILED' }}</strong></li>
              <li>Performance Tests: <strong>${{ needs.performance-tests.outputs.status == 'success' && '✅ PASSED' || '❌ FAILED' }}</strong></li>
              <li>Stress Tests: <strong>${{ needs.stress-tests.outputs.status == 'success' && '✅ PASSED' || '❌ FAILED' }}</strong></li>            </ul>
            
            <h3>Test Summary:</h3>
            <p>
              UI Tests: ${{ needs.ui-tests.outputs.status == 'success' && '✅' || '❌' }}<br>
              API Tests: ${{ needs.api-tests.outputs.status == 'success' && '✅' || '❌' }}<br>
              Performance Tests: ${{ needs.performance-tests.outputs.status == 'success' && '✅' || '❌' }}<br>
              Stress Tests: ${{ needs.stress-tests.outputs.status == 'success' && '✅' || '❌' }}
            </p>
            
            <p>For detailed results, please check the workflow artifacts in GitHub Actions.</p>
            
            <hr>
            <p><small>This is an automated message from GitHub Actions</small></p>
