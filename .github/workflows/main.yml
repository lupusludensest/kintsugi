name: Kintsugi Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *" # Runs at 7:00 AM UTC (2:00 AM EST)
  workflow_dispatch: # Allows manual triggering

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.test.outcome }}
      passed: ${{ steps.parse-results.outputs.passed }}
      failed: ${{ steps.parse-results.outputs.failed }}
      
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run UI tests
        id: test
        run: npx playwright test ui_tests/ 2>&1 | tee ui_test_output.log
        continue-on-error: true
        env:
          CI: true
      - name: Parse test results
        id: parse-results
        run: |
          if [ -f ui_test_output.log ]; then
            # Extract passed and failed counts from Playwright output
            PASSED=$(grep -o '[0-9]\+ passed' ui_test_output.log | grep -o '[0-9]\+' || echo "0")
            FAILED=$(grep -o '[0-9]\+ failed' ui_test_output.log | grep -o '[0-9]\+' || echo "0")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "UI Tests - Passed: $PASSED, Failed: $FAILED"
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui
          path: |
            playwright-report/
            test-results/
            ui_test_output.log
          retention-days: 30
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.test.outcome }}
      passed: ${{ steps.parse-results.outputs.passed }}
      failed: ${{ steps.parse-results.outputs.failed }}
      
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run API tests
        id: test
        run: npx playwright test api_tests/ 2>&1 | tee api_test_output.log
        continue-on-error: true
        env:
          CI: true
      - name: Parse test results
        id: parse-results
        run: |
          if [ -f api_test_output.log ]; then
            PASSED=$(grep -o '[0-9]\+ passed' api_test_output.log | grep -o '[0-9]\+' || echo "0")
            FAILED=$(grep -o '[0-9]\+ failed' api_test_output.log | grep -o '[0-9]\+' || echo "0")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "API Tests - Passed: $PASSED, Failed: $FAILED"
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: |
            playwright-report/
            test-results/
            api_test_output.log
          retention-days: 30
  performance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.test.outcome }}
      passed: ${{ steps.parse-results.outputs.passed }}
      failed: ${{ steps.parse-results.outputs.failed }}
      
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Performance tests
        id: test
        run: npx playwright test performance_tests/ 2>&1 | tee performance_test_output.log
        continue-on-error: true
        env:
          CI: true
      - name: Parse test results
        id: parse-results
        run: |
          if [ -f performance_test_output.log ]; then
            PASSED=$(grep -o '[0-9]\+ passed' performance_test_output.log | grep -o '[0-9]\+' || echo "0")
            FAILED=$(grep -o '[0-9]\+ failed' performance_test_output.log | grep -o '[0-9]\+' || echo "0")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "Performance Tests - Passed: $PASSED, Failed: $FAILED"
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-performance
          path: |
            playwright-report/
            test-results/
            performance_test_output.log
          retention-days: 30
  stress-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.test.outcome }}
      passed: ${{ steps.parse-results.outputs.passed }}
      failed: ${{ steps.parse-results.outputs.failed }}
      
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Stress tests
        id: test
        run: npx playwright test stress_tests/ 2>&1 | tee stress_test_output.log
        continue-on-error: true
        env:
          CI: true
      - name: Parse test results
        id: parse-results
        run: |
          if [ -f stress_test_output.log ]; then
            PASSED=$(grep -o '[0-9]\+ passed' stress_test_output.log | grep -o '[0-9]\+' || echo "0")
            FAILED=$(grep -o '[0-9]\+ failed' stress_test_output.log | grep -o '[0-9]\+' || echo "0")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "Stress Tests - Passed: $PASSED, Failed: $FAILED"
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stress
          path: |
            playwright-report/
            test-results/
            stress_test_output.log
          retention-days: 30
  notify:
    needs: [ui-tests, api-tests, performance-tests, stress-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Calculate totals and pass rate
        id: calculate
        run: |
          # Get passed and failed counts
          UI_PASSED=${{ needs.ui-tests.outputs.passed }}
          UI_FAILED=${{ needs.ui-tests.outputs.failed }}
          API_PASSED=${{ needs.api-tests.outputs.passed }}
          API_FAILED=${{ needs.api-tests.outputs.failed }}
          PERF_PASSED=${{ needs.performance-tests.outputs.passed }}
          PERF_FAILED=${{ needs.performance-tests.outputs.failed }}
          STRESS_PASSED=${{ needs.stress-tests.outputs.passed }}
          STRESS_FAILED=${{ needs.stress-tests.outputs.failed }}
          
          # Calculate totals
          TOTAL_PASSED=$((UI_PASSED + API_PASSED + PERF_PASSED + STRESS_PASSED))
          TOTAL_FAILED=$((UI_FAILED + API_FAILED + PERF_FAILED + STRESS_FAILED))
          TOTAL_TESTS=$((TOTAL_PASSED + TOTAL_FAILED))
          
          # Calculate pass rate (using bc for floating point)
          if [ $TOTAL_TESTS -gt 0 ]; then
            PASS_RATE=$(echo "scale=2; $TOTAL_PASSED * 100 / $TOTAL_TESTS" | bc)
          else
            PASS_RATE="0.00"
          fi
          
          # Calculate individual totals
          UI_TOTAL=$((UI_PASSED + UI_FAILED))
          API_TOTAL=$((API_PASSED + API_FAILED))
          PERF_TOTAL=$((PERF_PASSED + PERF_FAILED))
          STRESS_TOTAL=$((STRESS_PASSED + STRESS_FAILED))
          
          echo "total_passed=$TOTAL_PASSED" >> $GITHUB_OUTPUT
          echo "total_failed=$TOTAL_FAILED" >> $GITHUB_OUTPUT
          echo "total_tests=$TOTAL_TESTS" >> $GITHUB_OUTPUT
          echo "pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT
          echo "ui_total=$UI_TOTAL" >> $GITHUB_OUTPUT
          echo "api_total=$API_TOTAL" >> $GITHUB_OUTPUT
          echo "perf_total=$PERF_TOTAL" >> $GITHUB_OUTPUT
          echo "stress_total=$STRESS_TOTAL" >> $GITHUB_OUTPUT
          
          echo "Calculated totals: Passed=$TOTAL_PASSED, Failed=$TOTAL_FAILED, Total=$TOTAL_TESTS, Pass Rate=$PASS_RATE%"
        shell: bash
      
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Kintsugi Test Results - ${{ needs.ui-tests.result == 'success' && needs.api-tests.result == 'success' && needs.performance-tests.result == 'success' && needs.stress-tests.result == 'success' && 'SUCCESS' || 'FAILURE' }}
          to: gurovvic@gmail.com,rodionigor@gmail.com, svetlanalegkaya15@gmail.com, petushin@kpd-cargo.com
          from: GitHub Actions
          html_body: |
            <h2>Kintsugi Test Suite Results</h2>
            <p>Overall Status: <strong>${{ needs.ui-tests.result == 'success' && needs.api-tests.result == 'success' && needs.performance-tests.result == 'success' && needs.stress-tests.result == 'success' && 'SUCCESS' || 'FAILURE' }}</strong></p>
            <p>Workflow: <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.workflow }}</a></p>             
                          
            <h3>Test Results Breakdown:</h3>
            <ul>
              <li>UI Tests: ${{ needs.ui-tests.outputs.passed }} ✅, ${{ needs.ui-tests.outputs.failed }} ❌ (Total: ${{ steps.calculate.outputs.ui_total }})</li>
              <li>API Tests: ${{ needs.api-tests.outputs.passed }} ✅, ${{ needs.api-tests.outputs.failed }} ❌ (Total: ${{ steps.calculate.outputs.api_total }})</li>
              <li>Performance Tests: ${{ needs.performance-tests.outputs.passed }} ✅, ${{ needs.performance-tests.outputs.failed }} ❌ (Total: ${{ steps.calculate.outputs.perf_total }})</li>
              <li>Stress Tests: ${{ needs.stress-tests.outputs.passed }} ✅, ${{ needs.stress-tests.outputs.failed }} ❌ (Total: ${{ steps.calculate.outputs.stress_total }})</li>
            </ul>
            
            <h3>Total Counts:</h3>
            <p>
              <strong>Total Passed Tests:</strong> ${{ needs.ui-tests.outputs.passed }} + ${{ needs.api-tests.outputs.passed }} + ${{ needs.performance-tests.outputs.passed }} + ${{ needs.stress-tests.outputs.passed }} = ${{ steps.calculate.outputs.total_passed }}<br>
              <strong>Total Tests:</strong> ${{ steps.calculate.outputs.ui_total }} + ${{ steps.calculate.outputs.api_total }} + ${{ steps.calculate.outputs.perf_total }} + ${{ steps.calculate.outputs.stress_total }} = ${{ steps.calculate.outputs.total_tests }}
            </p>

            <p>
              <strong>Pass Rate = ${{ steps.calculate.outputs.total_passed }} / ${{ steps.calculate.outputs.total_tests }} × 100 = ${{ steps.calculate.outputs.pass_rate }}%</strong>
            </p>
            
            <p>For detailed results, please check the workflow artifacts in GitHub Actions.</p>
            
            <hr>
            <p><small>This is an automated message from GitHub Actions</small></p>
