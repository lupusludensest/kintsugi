name: Kintsugi Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 7 * * *'  # Runs at 7:00 AM UTC (2:00 AM EST)
  workflow_dispatch:  # Allows manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      matrix:
        test-group: [ui, api, performance, stress]
      fail-fast: false  # Continue with other tests even if one group fails

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run API tests
        if: matrix.test-group == 'api'
        run: npx playwright test api_tests/
        env:
          CI: true

      - name: Run UI tests
        if: matrix.test-group == 'ui'
        run: npx playwright test ui_tests/
        env:
          CI: true

      - name: Run Performance tests
        if: matrix.test-group == 'performance'
        run: npx playwright test performance_tests/
        env:
          CI: true

      - name: Run Stress tests
        if: matrix.test-group == 'stress'
        run: npx playwright test stress_tests/
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.test-group }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  notify:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            echo "All tests passed successfully!"
            exit 0
          else
            echo "Some tests failed. Check the test reports for details."
            exit 1
          fi
